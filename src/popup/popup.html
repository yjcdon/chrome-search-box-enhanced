<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1 id="popupTitle"></h1>
    </header>

    <section class="add-section">
      <label for="siteInput" id="inputLabel"></label>
      <input type="text" id="siteInput" placeholder="">
      <div class="button-group">
        <button id="cancelBtn" class="btn btn-cancel"></button>
        <button id="addBtn" class="btn btn-add"></button>
      </div>
      <p id="errorMsg" class="error-msg"></p>
    </section>

    <section class="list-section">
      <h2 id="listTitle"></h2>
      <ul id="disabledList" class="disabled-list">
        <li class="empty-state"></li>
      </ul>
    </section>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
